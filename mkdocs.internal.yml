site_name: RTMS Documentation Technique (3TS Consulting)
site_description: Documentation technique interne, d'architecture, de déploiement et de conformité de la plateforme RTMS.
site_author: 3TS Consulting SRL
copyright: Copyright &copy; 2025-2026 3TS Consulting SRL. All rights reserved.

dev_addr: '127.0.0.1:8008'
docs_dir: docs-internal
site_dir: site-internal

theme:
  name: material
  language: fr
  palette:
    # Mode sombre par défaut
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Passer au mode clair
    # Mode clair
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Passer au mode sombre
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - i18n:
      languages:
        - locale: fr
          default: true
          name: Français
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            Accueil: Home
            Architecture: Architecture
            Vue d'ensemble: System Overview
            Réseau & WireGuard: Network & WireGuard
            Modèle RBAC (Permissions): RBAC Security Model
            Sécurité & RBAC Base de Données: Database Security & RBAC
            Modèles de données: Data Models
            Déploiement & Installation: Deployment & Installation
            Guide de Déploiement Ansible: Ansible Deployment Guide
            Guide Installation & Durcissement PostgreSQL: PostgreSQL Hardening Guide
            Composants & Internals: Components & Internals
            Scanner: Scanner
            Prérequis techniques: Technical Requirements
            Mobilité, Cycle de vie & Multi-réseaux: Mobility & Multi-Network Lifecycle
            Mode Standalone: Standalone Mode
            Versions & Changelog: Versions & Changelog
            Docker & PyInstaller: Docker & Packaging
            Commandes Bettercap: Bettercap Commands
            Audit Email & DNS: Email & DNS Audits
            Ciblage Granulaire du Deep Scan: Granular Deep Scan Targeting
            Ressources & Tests HTTP: Resources & HTTP Diagnostics
            Web: Web
            Documentation technique: Technical Documentation
            Corrélation Menaces SOC / SIEM: SOC / SIEM Threat Correlation Guide
            Mode d'Emploi Dashboard Menaces: Threat Dashboard User Guide
            Déploiement Nginx & Frontend: Production Nginx & Frontend Setup
            Guide SSO Keycloak & OIDC: Enterprise SSO Keycloak & OIDC
            Démarrage: Backend Startup Guide
            Local Agent: Local Agent
            Architecture technique: Agent Architecture
            Guide d'installation: Agent Installation & Firewall
            NVD Microservice: NVD Microservice
            Documentation NVD: NVD Technical Documentation
            Guide d'installation: NVD Installation Guide
            Démarrage & Ingestion: Startup & Ingestion Sequence
            Exportation de rapports CVE: Exporting CVE Data
            Admin: Admin
            Guide d'administration: Admin & Licensing Workflow
            Plugins: Plugins
            Spécification & Développement: Plugin Specifications & Dev Guide
            Conformité & Légal: Governance & Legal Compliance
            Directive NIS2: NIS 2 Compliance
            Cyber Resilience Act (CRA): Cyber Resilience Act (CRA)
            Stratégie de Release: Release Strategy
            Licences: Software Licenses & Copyrights
            Documents Légaux: Legal Documents
            EULA: End User License Agreement
            Normes appliquées: Applied Standards
            Déclaration UE: EU Declaration of Conformity
            Évaluation des risques: Risk Assessment

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - toc:
      permalink: true

nav:
  - Accueil: index.md
  - Architecture:
      - Vue d'ensemble: architecture/overview.md
      - Réseau & WireGuard: architecture/wireguard.md
      - Modèle RBAC (Permissions): architecture/rbac.md
      - Sécurité & RBAC Base de Données: architecture/database_rbac.md
      - Modèles de données:
          - Scanner Data Model: architecture/data_models/scanner_data_model.md
          - NVD Data Model: architecture/data_models/nvd_data_model.md
  - Déploiement & Installation:
      - Guide de Déploiement Ansible: deployment/ansible_deployment_guide.md
      - Guide Installation & Durcissement PostgreSQL: deployment/postgres_hardening_guide.md
  - Composants & Internals:
      - Scanner:
          - Prérequis techniques: components/scanner/technical_requirements.md
          - Mobilité, Cycle de vie & Multi-réseaux: components/scanner/mobility_lifecycle.md
          - Mode Standalone: components/scanner/stand_alone.md
          - Versions & Changelog: components/scanner/versions.md
          - Docker & PyInstaller: components/scanner/docker.md
          - Commandes Bettercap: components/scanner/bettercap_commands.md
          - Audit Email & DNS: components/scanner/email_and_dns_audits.md
          - Ciblage Granulaire du Deep Scan: components/scanner/deep_scan_targeting.md
          - Ressources & Tests HTTP: components/scanner/resources.md
      - Web:
          - Documentation technique: components/web/technical_documentation.md
          - Corrélation Menaces SOC / SIEM: components/web/soc_threat_correlation_guide.md
          - Mode d'Emploi Dashboard Menaces: components/web/user_guide_threat_dashboard.md
          - Déploiement Nginx & Frontend: components/web/frontend_nginx_setup.md
          - Guide SSO Keycloak & OIDC: components/web/sso_keycloak_guide.md
          - Démarrage: components/web/startup.md
      - Local Agent:
          - Architecture technique: components/local-agent/technical_doc.md
          - Guide d'installation: components/local-agent/install.md
      - NVD Microservice:
          - Documentation NVD: components/nvd/rtms_nvd_documentation.md
          - Guide d'installation: components/nvd/install.md
          - Démarrage & Ingestion: components/nvd/readme_startup.md
          - Exportation de rapports CVE: components/nvd/readme_export_cve.md
      - Admin:
          - Guide d'administration: components/admin/admin_guide.md
  - Plugins:
      - Spécification & Développement: plugins/plugin_specification.md
  - Conformité & Légal:
      - Directive NIS2: compliance/nis2.md
      - Cyber Resilience Act (CRA): compliance/cra.md
      - Stratégie de Release: compliance/release_strategy.md
      - Licences: compliance/licenses.md
      - Documents Légaux:
          - EULA: compliance/legal/EULA.md
          - Normes appliquées: compliance/legal/Applied_standards.md
          - Déclaration UE: compliance/legal/EU_declaration_template.md
          - Évaluation des risques: compliance/legal/risk_assessmnent.md
